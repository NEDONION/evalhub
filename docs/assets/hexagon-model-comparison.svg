<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1320" role="img"
  aria-labelledby="chart-title chart-description">
  <title id="chart-title">EvalHub 六维模型能力对比</title>
  <desc id="chart-description">
    11 个本地及线上模型在 EvalHub Hexagon 1.2 套件上的知识、指令遵循、数学、综合推理、代码和安全可信得分。
  </desc>
  <style>
    .canvas { fill: #f8fafc; }
    .panel { fill: #ffffff; stroke: #dbe4f0; stroke-width: 1.5; }
    .grid { fill: none; stroke: #d8e2ef; stroke-width: 1.2; }
    .outer-grid { fill: #f8fbff; stroke: #b8c8dc; stroke-width: 1.5; }
    .axis { stroke: #d8e2ef; stroke-width: 1.2; }
    .model-name { fill: #0f172a; font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .overall { fill: #2563eb; font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .axis-label { fill: #52657f; font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .score-polygon { fill: #2563eb; fill-opacity: 0.20; stroke: #2563eb; stroke-width: 3; stroke-linejoin: round; }
    .score-point { fill: #2563eb; }
  </style>

  <rect class="canvas" width="1200" height="1320" />

  <defs>
    <g id="radar-grid">
      <polygon class="outer-grid" points="190,105 267.9,150 267.9,240 190,285 112.1,240 112.1,150" />
      <polygon class="grid" points="190,127.5 248.5,161.3 248.5,228.8 190,262.5 131.5,228.8 131.5,161.3" />
      <polygon class="grid" points="190,150 229,172.5 229,217.5 190,240 151,217.5 151,172.5" />
      <polygon class="grid" points="190,172.5 209.5,183.8 209.5,206.3 190,217.5 170.5,206.3 170.5,183.8" />
      <line class="axis" x1="190" y1="195" x2="190" y2="105" />
      <line class="axis" x1="190" y1="195" x2="267.9" y2="150" />
      <line class="axis" x1="190" y1="195" x2="267.9" y2="240" />
      <line class="axis" x1="190" y1="195" x2="190" y2="285" />
      <line class="axis" x1="190" y1="195" x2="112.1" y2="240" />
      <line class="axis" x1="190" y1="195" x2="112.1" y2="150" />
      <text class="axis-label" x="190" y="94" text-anchor="middle">知识</text>
      <text class="axis-label" x="278" y="147">指令遵循</text>
      <text class="axis-label" x="278" y="247">数学</text>
      <text class="axis-label" x="190" y="303" text-anchor="middle">综合推理</text>
      <text class="axis-label" x="102" y="247" text-anchor="end">代码</text>
      <text class="axis-label" x="102" y="147" text-anchor="end">安全可信</text>
    </g>
  </defs>

  <g class="model-panel" transform="translate(10 0)">
    <rect class="panel" x="0" y="8" width="380" height="314" rx="16" />
    <text class="model-name" x="20" y="36">deepseek-v4-pro</text>
    <text class="overall" x="360" y="36" text-anchor="end">83.33%</text>
    <use href="#radar-grid" />
    <polygon class="score-polygon" points="190,141 267.9,150 252.4,231 190,267 127.6,231 112.1,150" />
  </g>

  <g class="model-panel" transform="translate(410 0)">
