<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EvalHub 企业评测工作台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" aria-label="主导航">
        <div class="brand">
          <div class="brandMark">EH</div>
          <div>
            <h1>EvalHub</h1>
            <p>模型评测平台</p>
          </div>
        </div>
        <nav class="nav">
          <a class="navItem active" href="#">评测工作台</a>
          <a class="navItem muted" href="#">模型注册</a>
          <a class="navItem muted" href="#">数据集资产</a>
          <a class="navItem muted" href="#">Benchmark</a>
          <a class="navItem muted" href="#">排行榜</a>
          <a class="navItem muted" href="#">发布门禁</a>
        </nav>
        <div class="sidebarFooter">
          <span>本地环境</span>
          <strong>Local</strong>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <div>
            <h2>评测工作台</h2>
            <p>统一执行真实 Benchmark，查看样本级结果与聚合指标。</p>
          </div>
          <div class="topActions">
            <span id="health" class="status">检测中</span>
            <button id="refreshBtn" type="button" class="secondaryBtn">刷新</button>
          </div>
        </header>

        <main class="content">
          <section class="metrics" aria-label="评测概览">
            <div class="metricTile">
              <span>服务状态</span>
              <strong id="serviceMetric">检测中</strong>
            </div>
            <div class="metricTile">
              <span>数据集</span>
              <strong id="datasetMetric">-</strong>
            </div>
            <div class="metricTile">
              <span>已缓存</span>
              <strong id="preparedMetric">-</strong>
            </div>
            <div class="metricTile">
              <span>最近得分</span>
              <strong id="scoreMetric">-</strong>
            </div>
          </section>

          <section class="mainGrid">
            <section class="panel assetPanel">
              <div class="panelHead">
                <div>
                  <h3>数据集资产</h3>
                  <p>真实公开 Benchmark 本地缓存状态</p>
                </div>
              </div>
              <div id="datasets" class="datasetList"></div>
            </section>

            <section class="panel">
              <div class="panelHead">
                <div>
                  <h3>新建评测任务</h3>
                  <p>选择数据集、模型适配器和样本规模</p>
                </div>
              </div>
              <form id="runForm" class="form">
                <label>
                  数据集
                  <select id="datasetSelect" name="dataset">
                    <option value="gsm8k">GSM8K 测试集</option>
                    <option value="mmlu">MMLU 测试集</option>
                  </select>
                </label>

                <label>
                  MMLU 学科
                  <input id="subjectInput" name="subject" value="abstract_algebra" />
                </label>

                <label>
                  模型适配器
                  <select id="adapterSelect" name="adapter">
                    <option value="ollama">Ollama 本地模型</option>
                    <option value="oracle">Oracle 管线自检</option>
                  </select>
                </label>

                <label>
                  模型名称
                  <input id="modelInput" name="model" value="qwen2.5:0.5b" />
                </label>

                <label>
                  Ollama 地址
                  <input id="baseUrlInput" name="base_url" value="http://127.0.0.1:11434" />
                </label>

                <label>
                  样本数量
                  <input id="limitInput" name="limit" type="number" min="1" max="1000" value="5" />
                </label>

                <div class="actions">
                  <button id="prepareBtn" type="button" class="secondaryBtn">缓存数据集</button>
                  <button type="submit">发起评测</button>
                </div>
              </form>
            </section>
          </section>

          <section class="panel resultPanel">
            <div class="panelHead">
              <div>
                <h3>评测结果</h3>
                <p>聚合指标与失败样例明细</p>
              </div>
            </div>
            <div id="resultSummary" class="resultSummary empty">暂无评测结果</div>
            <pre id="output">等待任务执行。</pre>
          </section>
        </main>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
